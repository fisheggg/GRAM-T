# final-SELD-A1: downstream SELD from the final-pt-A0 checkpoint.
# STARSS23 converted to the pretraining convention: dipoles x sqrt(3) (SN3D -> N3D) before RMS normalization, and vertical moved into feature ch1. Archived Stage 3 B0.
# Run: sbatch --job-name=final-SELD-A1 scripts/seld.sh configs/seld/final_SELD_A1.yaml
# Read by seld-dcase-2022-GRAM/parameters.py; "params" replaces the task-id defaults.
task_id: '20'
experiment_dir: /cluster/work/projects/nn8104k/jinyueg/ambi_ssl/runs/final-A0
pretrain_step: 200000          # encoder: <experiment_dir>/pretrain/**/step=200000.ckpt
run_dir: /cluster/work/projects/nn8104k/jinyueg/ambi_ssl/runs/final-A0/seld_fix1   # features/, models/, predictions/

wandb:
  entity: ritmo
  project: ambi-ssl
  name: final-SELD-A1
  group: final-A0

params:
  quick_test: false
  mode: dev
  dataset: foa
  # STARSS23 (90 real recordings) + 1,200 synthetic, at 32 kHz; train folds 1-3, val = test = fold 4
  dataset_dir: /cluster/work/projects/nn8104k/jinyueg/ambi_ssl/data/SELD_combined
  dataset_year: '2022'         # STARSS22/23 splits and 13 classes

  # ambisonics format fix (see seld-dcase-2022-GRAM/foa_convention.py)
  sn3d_to_n3d: true
  swap_vertical_to_ch1: true

  # features
  fs: 32000
  hop_len_s: 0.01
  label_hop_len_s: 0.1
  max_audio_len_s: 60
  nb_mel_bins: 128
  label_sequence_length: 20    # 2 s clips, 200 feature frames

  # output and training
  multi_accdoa: false          # single ACCDOA
  batch_size: 512
  micro_batch_size: 32         # gradient accumulation: same update as one batch of 512
  lr: 0.0001                   # Adam
  nb_epochs: 100               # validate every 3rd epoch; best val epoch is tested

  # metrics
  average: macro
  lad_doa_thresh: 20
